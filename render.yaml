# Render deployment config for the Flask backend
# Free tier: https://render.com

services:
  - type: web
    name: trading-bot-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT backend.api.app:app"
    envVars:
      - key: BROKER_TYPE
        value: demo
      - key: AUTO_START_BOT
        value: "true"
      - key: BOT_INTERVAL_SECONDS
        value: "60"
      - key: AUTO_EXECUTE_TRADES
        value: "true"
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.0"
